<span class="h"># About</span>

In my day-to-day business I am somewhere between research code and production
data pipelines — mostly enjoying Software Engineering as a craft while it
has not been killed yet through our unwavering quest to make ourselves
Skynet's prey! Prior to that I was concerned proving to my advisor I
deserve a PhD through working on 3D Computer Vision.

<span class="h">## what I work on</span>

- <span class="b">MLOps for Fanar</span> — building MLOps solutions for Fanar Arabic GenAI,
  addressing Effective Data Management, Data Analytics, Data-Training-
  Deployment Pipelines, and production-grade code.
- <span class="b">(3D) Computer Vision</span> — worked on the alignment problem of
  partially-overlapping 3D point clouds during my PhD.
- <span class="b">Humanitarian AI</span> — Computer Vision for remote-sensing data for
  disaster analysis.

<span class="h">## philosophy</span>

> Only reviewed code is good code.

I like clear terminology, people who look at code as the outcome of
<span class="b">Software Engineering</span> — not "coding" or "programming" — and people who
don't consider science a source for fame but rather a mission to deliver
societal impact.
</pre>
